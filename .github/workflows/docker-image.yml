name: Build & push web image

# Builds the SvelteKit (adapter-node) web app + API into a Docker image and
# pushes it to Docker Hub, so Coolify can deploy/redeploy it. Pulls/redeploys
# are handled on the Coolify side (no deploy webhook here).
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   DOCKERHUB_USERNAME  — your Docker Hub username (also the image namespace)
#   DOCKERHUB_TOKEN     — a Docker Hub access token with read/write
#
# Published image: docker.io/<DOCKERHUB_USERNAME>/shotcoach
#   tags: latest, sha-<short commit>
# Point Coolify at <DOCKERHUB_USERNAME>/shotcoach:latest.

on:
  push:
    branches: [master]
    paths-ignore:
      - "ios/**"
      - "android/**"
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/shotcoach
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
