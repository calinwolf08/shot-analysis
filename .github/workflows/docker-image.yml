name: Build & push web image

# Builds the SvelteKit (adapter-node) web app + API image on a GitHub runner and
# pushes it to the GitHub Container Registry (ghcr.io). Auth uses the built-in
# GITHUB_TOKEN — NO Docker Hub (or any other) registry credentials are needed.
# Coolify then just pulls and runs the image.
#
# Published image: ghcr.io/<owner>/shot-analysis
#   tags: latest (on master), <branch>, sha-<short commit>
# Point your Coolify "Docker Image" resource at
#   ghcr.io/<owner>/shot-analysis:latest
#
# Optional auto-deploy: set two repo secrets and Coolify redeploys on each push —
#   COOLIFY_WEBHOOK  — the deploy webhook URL from the Coolify resource
#   COOLIFY_TOKEN    — a Coolify API token
# Without them, the deploy step is skipped and you redeploy manually in Coolify.

on:
  push:
    branches: [master]
    paths-ignore:
      - "ios/**"
      - "android/**"
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute lowercase image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Coolify deploy
        if: ${{ env.COOLIFY_WEBHOOK != '' }}
        run: |
          curl --fail --silent --show-error \
            --header "Authorization: Bearer ${COOLIFY_TOKEN}" \
            "${COOLIFY_WEBHOOK}"
