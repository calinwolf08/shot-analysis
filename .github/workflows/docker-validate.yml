name: Validate web image build

# Builds the web app + API image WITHOUT pushing, to catch Dockerfile/build
# breakage before it reaches master. No registry, no secrets. The push +
# publish happens separately on master (docker-image.yml).

on:
  pull_request:
    branches: [master]
    paths-ignore:
      - "ios/**"
      - "android/**"
      - "docs/**"
      - "**/*.md"
  push:
    branches-ignore: [master]
    paths-ignore:
      - "ios/**"
      - "android/**"
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: docker-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: false
          tags: shotcoach:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
