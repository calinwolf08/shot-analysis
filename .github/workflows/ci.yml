name: CI

# Quality gate + end-to-end tests. Runs on PRs to master and on any non-master
# branch push, so dev-only and real-UI breakage is caught before it reaches
# master. (Image build is covered separately by docker-validate.yml.)

on:
  pull_request:
    branches: [master]
    paths-ignore:
      - "ios/**"
      - "android/**"
      - "docs/**"
      - "**/*.md"
  push:
    branches-ignore: [master]
    paths-ignore:
      - "ios/**"
      - "android/**"
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types & unit tests
    # Pinned: GitHub's ubuntu-latest (26.04) isn't yet supported by
    # Playwright's dependency installer used in the e2e job; pin both for parity.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # npm ci runs the root postinstall, which stages the MediaPipe WASM.
      - run: npm ci
      # Fails on case-only filename collisions (e.g. Toast.svelte vs
      # toast.svelte.ts) that resolve wrong on Vite dev / case-insensitive FS.
      - run: npm run check:case
      - name: Build library (dist/ the app imports)
        run: npm run build
      - name: Library unit tests
        run: npm test
      - name: App types (svelte-check)
        run: npm run check --workspace shotcoach
      - name: App lint (prettier + eslint)
        run: npm run lint --workspace shotcoach
      - name: App unit tests
        run: npm test --workspace shotcoach

  e2e:
    name: End-to-end (prod build + dev parity)
    # Playwright 1.58.2's `--with-deps` doesn't recognize ubuntu 26.04
    # (current ubuntu-latest), so pin to 24.04 which it supports.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build library
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: app
      # Playwright boots both servers itself: the adapter-node prod build on
      # :4173 (full suite) and `vite dev` on :5174 (parity smoke).
      - name: Run e2e
        run: npm run test:e2e --workspace shotcoach
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: app/playwright-report
          retention-days: 7

  postgres:
    name: Postgres (DB suites + e2e on a real server)
    # The same server code on Postgres instead of SQLite: the database suites
    # (repos, migrations, auth, live pipeline) against a real server, then the
    # prod-build e2e suite with DATABASE_URL. See
    # docs/database-abstraction-plan.md (Phase 5).
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shotcoach
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/shotcoach
      E2E_DATABASE_URL: postgres://postgres:postgres@localhost:5432/shotcoach_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build library
        run: npm run build
      # One file at a time: each test empties the server's public schema.
      - name: Database suites on Postgres
        run: npm run test:db --workspace shotcoach
      - name: Create the e2e database
        run: PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE shotcoach_e2e"
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: app
      # The prod-build projects (the dev-server parity tier stays on SQLite).
      - name: e2e on Postgres
        run: npx playwright test --project=chromium --project=mobile-fakecam
        working-directory: app
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-postgres
          path: app/playwright-report
          retention-days: 7
