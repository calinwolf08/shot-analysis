<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pro Reference Review</title>
    <style>
      :root {
        --bg: #0f1115;
        --panel: #171a21;
        --panel2: #1f232c;
        --border: #2c313c;
        --text: #e6e8ee;
        --dim: #9aa3b2;
        --accent: #60a5fa;
        --good: #34d399;
        --fair: #fbbf24;
        --off: #fb923c;
        --far: #f87171;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font:
          14px/1.4 system-ui,
          sans-serif;
      }
      button,
      select,
      input,
      textarea {
        font: inherit;
        color: var(--text);
        background: var(--panel2);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 4px 8px;
      }
      button {
        cursor: pointer;
      }
      button:hover:not(:disabled) {
        border-color: var(--accent);
      }
      button:disabled {
        opacity: 0.45;
        cursor: default;
      }
      button.primary {
        background: #1d4ed8;
        border-color: #1d4ed8;
      }
      header {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 8px 14px;
        border-bottom: 1px solid var(--border);
        background: var(--panel);
      }
      header h1 {
        font-size: 16px;
        margin: 0;
      }
      #saveState {
        color: var(--dim);
        font-size: 12px;
        margin-left: auto;
      }
      #layout {
        display: grid;
        grid-template-columns: 260px minmax(0, 1fr) 420px;
        height: calc(100vh - 45px);
      }
      aside,
      #panel {
        overflow-y: auto;
        background: var(--panel);
        border-right: 1px solid var(--border);
        padding: 10px;
      }
      #panel {
        border-right: 0;
        border-left: 1px solid var(--border);
      }
      main {
        display: flex;
        flex-direction: column;
        min-width: 0;
        overflow-y: auto;
        padding: 10px;
        gap: 8px;
      }
      .row {
        display: flex;
        gap: 6px;
        align-items: center;
        flex-wrap: wrap;
      }
      .dim {
        color: var(--dim);
      }
      .small {
        font-size: 12px;
      }
      /* library tree */
      .player button {
        padding: 0 6px;
        font-size: 12px;
        white-space: nowrap;
        align-self: flex-start;
      }
      .player {
        margin: 8px 0 4px;
        font-weight: 600;
        display: flex;
        justify-content: space-between;
        gap: 6px;
      }
      .clip {
        margin-left: 8px;
        color: var(--dim);
        font-size: 12px;
        margin-top: 6px;
        display: flex;
        justify-content: space-between;
        cursor: pointer;
      }
      .clip.active {
        color: var(--text);
      }
      .attempt {
        margin-left: 16px;
        padding: 2px 6px;
        border-radius: 4px;
        cursor: pointer;
        display: flex;
        gap: 6px;
        align-items: center;
        font-size: 13px;
      }
      .attempt:hover {
        background: var(--panel2);
      }
      .attempt.active {
        background: #1e3a8a;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        display: inline-block;
        flex: none;
      }
      .s-unreviewed {
        background: #6b7280;
      }
      .s-approved {
        background: var(--good);
      }
      .s-flagged {
        background: var(--fair);
      }
      .s-excluded {
        background: var(--far);
      }
      .counts {
        font-size: 11px;
        color: var(--dim);
        font-weight: 400;
      }
      /* stage */
      #stage {
        position: relative;
        background: #000;
        border-radius: 8px;
        overflow: hidden;
        height: 56vh;
        min-height: 280px;
      }
      #stage video,
      #stage canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      #stage video {
        object-fit: contain;
      }
      #empty {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        color: var(--dim);
        text-align: center;
        padding: 20px;
      }
      #scrub input[type="range"] {
        flex: 1;
        min-width: 200px;
      }
      #marks {
        position: relative;
        height: 18px;
        margin: 0 6px;
      }
      .mark {
        position: absolute;
        top: 0;
        width: 2px;
        height: 18px;
        transform: translateX(-1px);
      }
      .mark.label {
        background: var(--accent);
      }
      .mark.detected {
        background: var(--fair);
        height: 9px;
        top: 9px;
      }
      .mark.window {
        background: rgb(255 255 255 / 12%);
        width: auto;
        transform: none;
      }
      .chips {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .chip-attempt {
        padding: 3px 8px;
        border-radius: 12px;
        border: 1px solid var(--border);
        cursor: pointer;
        display: flex;
        gap: 6px;
        align-items: center;
        font-size: 13px;
      }
      .chip-attempt.active {
        border-color: var(--accent);
        background: #1e3a8a;
      }
      /* panel */
      .tabs {
        display: flex;
        gap: 4px;
        margin: 8px 0;
      }
      .tabs button.active {
        border-color: var(--accent);
        background: #1e3a8a;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      td,
      th {
        padding: 4px;
        border-bottom: 1px solid var(--border);
        text-align: left;
        vertical-align: middle;
      }
      th {
        color: var(--dim);
        font-weight: 500;
        font-size: 12px;
      }
      .link {
        color: var(--accent);
        cursor: pointer;
        text-decoration: underline dotted;
      }
      .badge {
        font-size: 11px;
        padding: 1px 6px;
        border-radius: 8px;
        background: var(--panel2);
        border: 1px solid var(--border);
        white-space: nowrap;
      }
      .b-ok {
        color: var(--good);
        border-color: var(--good);
      }
      .b-off {
        color: var(--far);
        border-color: var(--far);
      }
      .b-warn {
        color: var(--fair);
        border-color: var(--fair);
      }
      .flags {
        display: flex;
        flex-direction: column;
        gap: 4px;
        margin: 6px 0;
      }
      .flag {
        font-size: 12px;
        padding: 4px 8px;
        border-radius: 6px;
        background: #3b2f10;
        color: #fde68a;
      }
      .phase-h {
        margin: 12px 0 4px;
        font-weight: 600;
        display: flex;
        justify-content: space-between;
      }
      .metric {
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 6px 8px;
        margin-bottom: 4px;
        cursor: pointer;
      }
      .metric.picked {
        border-color: var(--accent);
      }
      .metric.excluded {
        opacity: 0.55;
      }
      .metric .top {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .metric .top .text {
        flex: 1;
      }
      .score {
        min-width: 32px;
        text-align: center;
        border-radius: 10px;
        padding: 1px 6px;
        font-weight: 700;
        font-size: 12px;
        color: #111;
      }
      .score[data-band="good"] {
        background: var(--good);
      }
      .score[data-band="fair"] {
        background: var(--fair);
      }
      .score[data-band="off"] {
        background: var(--off);
      }
      .score[data-band="far"] {
        background: var(--far);
      }
      .score[data-band="none"] {
        background: #4b5563;
        color: var(--text);
      }
      .metric .detail {
        font-size: 12px;
        color: var(--dim);
        margin-top: 2px;
      }
      .decision button {
        min-width: 100px;
      }
      textarea {
        width: 100%;
        min-height: 60px;
      }
      #progress {
        font-size: 12px;
        color: var(--fair);
      }
      dialog {
        background: var(--panel);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 10px;
        width: min(720px, 92vw);
        padding: 16px;
      }
      dialog::backdrop {
        background: rgb(0 0 0 / 60%);
      }
      dialog th {
        width: 90px;
      }
      kbd {
        background: var(--panel2);
        border: 1px solid var(--border);
        border-radius: 3px;
        padding: 0 4px;
        font-size: 11px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Pro reference review</h1>
      <span class="dim small" id="totals"></span>
      <span id="saveState"></span>
    </header>
    <div id="layout">
      <aside>
        <div class="row">
          <select id="filter" title="Show attempts">
            <option value="all">All attempts</option>
            <option value="unreviewed">Unreviewed</option>
            <option value="flagged">Flagged</option>
            <option value="approved">Approved</option>
            <option value="excluded">Excluded</option>
            <option value="angle">Angle &gt; 20°</option>
          </select>
          <button id="newPlayer" title="Add a player">+ Player</button>
        </div>
        <div id="tree"></div>
      </aside>
      <main>
        <div class="row" id="clipBar">
          <strong id="clipTitle" class="dim">Pick a clip</strong>
          <span id="progress"></span>
          <span style="flex: 1"></span>
          <label class="small dim" title="Upload this clip's video (kept local)"
            ><button id="uploadVideo" disabled>Video…</button
            ><input id="videoInput" type="file" accept="video/*" hidden
          /></label>
          <button id="extract" disabled title="Run MediaPipe on the video">
            Extract poses
          </button>
          <button
            id="detectShots"
            disabled
            title="Add attempts for detected shots"
          >
            Detect shots
          </button>
          <button
            id="addAttempt"
            disabled
            title="New attempt around this frame"
          >
            + Attempt
          </button>
        </div>
        <div id="stage">
          <video id="video" muted playsinline preload="auto"></video>
          <canvas id="canvas"></canvas>
          <div id="empty">
            Pick an attempt from the library, or add a player and a clip.
          </div>
        </div>
        <div id="scrub">
          <div class="row">
            <button id="prev" title="Previous frame (←)">◀</button>
            <button id="play" title="Play / pause (space)">▶</button>
            <button id="next" title="Next frame (→)">▶</button>
            <input id="range" type="range" min="0" max="0" value="0" />
            <span id="frameNo" class="small dim">–</span>
            <label class="small dim" title="Show the whole clip on the timeline"
              ><input id="wholeClip" type="checkbox" /> Whole clip</label
            >
          </div>
          <div id="marks"></div>
        </div>
        <div class="chips" id="attemptChips"></div>
        <p class="small dim">
          <kbd>←</kbd>/<kbd>→</kbd> frame (<kbd>Shift</kbd> ×5) ·
          <kbd>J</kbd>/<kbd>K</kbd> previous / next attempt ·
          <kbd>A</kbd> approve · <kbd>F</kbd> flag · <kbd>X</kbd> exclude ·
          <kbd>Space</kbd> play
        </p>
      </main>
      <section id="panel">
        <div id="attemptHead" class="dim">No attempt selected.</div>
        <div class="flags" id="autoFlags"></div>
        <div class="tabs">
          <button data-tab="keyframes" class="active">Key frames</button>
          <button data-tab="camera">Camera</button>
          <button data-tab="metrics">Metrics</button>
          <button data-tab="decision">Decision</button>
        </div>
        <div id="tabBody"></div>
      </section>
    </div>
    <dialog id="calibrateDialog"></dialog>
    <script src="/dist/pro-review.js"></script>
  </body>
</html>
